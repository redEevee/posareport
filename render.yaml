services:
  - type: web
    name: ntonmaster-ad-report
    runtime: python
    buildCommand: ""
    startCommand: python app/server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CAFE24_MALL_ID
        value: ntonmaster
      - key: CAFE24_CLIENT_ID
        sync: false
      - key: CAFE24_CLIENT_SECRET
        sync: false
      - key: CAFE24_REDIRECT_URI
        value: https://report.posareport.store/auth/cafe24/callback
      - key: EVENT_ALLOWED_ORIGINS
        value: https://posareport.store,https://www.posareport.store
